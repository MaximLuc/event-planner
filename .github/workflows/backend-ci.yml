name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend check
    runs-on: ubuntu-24.04
    timeout-minutes: 20


    defaults:
      run: 
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.22.0"
          package_json_file: apps/api/package.json
          run_install: false
          cache: true
          cache_dependency_path: apps/api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Check lint
        run: pnpm exec eslint src test --max-warnings=0

      - name: Check TypeScript
        run: pnpm exec tsc --project test/tsconfig.json

      - name: Build application
        run: pnpm build

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Build Docker image
        working-directory: .
        run: docker build --target runtime --tag event-planner-api:ci ./apps/api